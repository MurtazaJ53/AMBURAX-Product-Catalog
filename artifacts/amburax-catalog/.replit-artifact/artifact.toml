kind = "web"
previewPath = "/"
title = "AMBURAX Product Catalog"
description = "A high-fidelity frontend prototype for AMBURAX F4.1 Product Catalog, with dense enterprise filters, a responsive product workspace, and a persistent product inspector backed by local mock data."
version = "1.0.0"
id = "artifacts/amburax-catalog"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20100

[services.development]
run = "pnpm --filter @workspace/amburax-catalog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/amburax-catalog", "run", "build" ]
serve = "static"
publicDir = "artifacts/amburax-catalog/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20100"
BASE_PATH = "/"
